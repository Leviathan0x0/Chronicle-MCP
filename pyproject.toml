[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-mcp-server"
version = "1.6.2"
description = "Local, private AI chat history search & memory MCP server: BM25 search over Cursor, Claude, ChatGPT and Cline transcripts. Saves up to 40% context tokens."
readme = "README.md"
authors = [{ name = "Leviathan" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-memory",
    "chat-history",
    "transcript-search",
    "cursor",
    "claude",
    "llm",
    "bm25",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x removed mcp.server.fastmcp; 1.22 is the oldest 1.x that works with current pydantic.
    "mcp>=1.22,<2",
    "typing_extensions>=4.6",
]

[project.urls]
Homepage = "https://github.com/Leviathan0x0/Chronicle-MCP"
Repository = "https://github.com/Leviathan0x0/Chronicle-MCP"
Issues = "https://github.com/Leviathan0x0/Chronicle-MCP/issues"
Documentation = "https://github.com/Leviathan0x0/Chronicle-MCP#readme"
Changelog = "https://github.com/Leviathan0x0/Chronicle-MCP/blob/main/CHANGELOG.md"

[project.scripts]
chronicle = "cli:main"
chronicle-mcp-server = "cli:serve"

[tool.setuptools]
py-modules = ["chat_server", "chat_core", "cli"]