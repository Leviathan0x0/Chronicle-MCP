[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-mcp-server"
version = "1.6.1"
description = "Local MCP server to sync, clean, and index AI chat logs locally. Saves up to 40% context tokens."
readme = "README.md"
authors = [{ name = "Leviathan" }]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-memory",
    "chat-history",
    "transcript-search",
    "cursor",
    "claude",
    "llm",
    "bm25",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Leviathan0x0/Chronicle-MCP"
Repository = "https://github.com/Leviathan0x0/Chronicle-MCP"
Issues = "https://github.com/Leviathan0x0/Chronicle-MCP/issues"
Documentation = "https://github.com/Leviathan0x0/Chronicle-MCP#readme"
Changelog = "https://github.com/Leviathan0x0/Chronicle-MCP/commits/main"

[project.scripts]
chronicle = "cli:main"

[tool.setuptools]
py-modules = ["chat_server", "chat_core", "cli"]