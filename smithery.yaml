# Smithery configuration: https://smithery.ai/docs/build/project-config
# Chronicle reads chat transcripts from your own disk, so it runs locally over stdio.
# Every setting is optional; with none, the archive lives in ~/.chronicle.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      baseDir:
        type: string
        title: Archive folder
        description: Folder where Chronicle stores its chat archive and index (sets CHRONICLE_BASE_DIR). Defaults to ~/.chronicle.
      transcriptsDir:
        type: string
        title: Transcripts folder
        description: Extra folder of agent transcript files to import with sync_workspace_data (sets TRANSCRIPTS_DIR).
      logLevel:
        type: string
        title: Log level
        description: Server log level written to stderr (sets CHRONICLE_LOG_LEVEL).
        enum: [DEBUG, INFO, WARNING, ERROR]
        default: WARNING
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['chronicle-mcp-server'],
      env: Object.fromEntries(Object.entries({
        CHRONICLE_BASE_DIR: config.baseDir,
        TRANSCRIPTS_DIR: config.transcriptsDir,
        CHRONICLE_LOG_LEVEL: config.logLevel
      }).filter(([, value]) => value))
    })
  exampleConfig:
    baseDir: ~/.chronicle
